# 公网部署：设置 SPRING_PROFILES_ACTIVE=prod 后启用。
# 所有敏感值均从云平台环境变量读取，不应提交到 Git。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

evidence:
  # 当前业务仍使用清楚标识的 Demo 存储/链网关；不可表述为真实 IPFS 或真实上链。
  mode: ${EVIDENCE_MODE:DEMO}
  security:
    # 示例：https://your-site.netlify.app；只能填前端实际来源，不要使用 *。
    cors-allowed-origins:
      - ${EVIDENCE_CORS_ALLOWED_ORIGIN}
  jwt:
    # 必填：至少 32 字节的随机密钥。
    secret: ${EVIDENCE_JWT_SECRET}
    expiration-minutes: ${EVIDENCE_JWT_EXPIRATION_MINUTES:120}
  bootstrap:
    # 默认关闭。仅在首次演示初始化时显式设为 true，并使用独立的强密码。
    enabled: ${EVIDENCE_BOOTSTRAP_ENABLED:false}
    username: ${EVIDENCE_BOOTSTRAP_USERNAME:}
    password: ${EVIDENCE_BOOTSTRAP_PASSWORD:}
    organization: ${EVIDENCE_BOOTSTRAP_ORGANIZATION:}
  chain:
    mode: ${EVIDENCE_CHAIN_MODE:DEMO}
    network: ${EVIDENCE_CHAIN_NETWORK:DEMO_XUPERCHAIN}
    contract-name: ${EVIDENCE_CHAIN_CONTRACT_NAME:demo-contract}
    node-endpoint: ${EVIDENCE_CHAIN_NODE_ENDPOINT:}
  ipfs:
    mode: ${EVIDENCE_IPFS_MODE:DEMO}
    provider-order:
      - DEMO_LOCAL
