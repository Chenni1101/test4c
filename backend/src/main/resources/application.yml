server:
  port: 8080

spring:
  application:
    name: cultural-evidence-backend
  datasource:
    url: jdbc:h2:mem:evidence;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

evidence:
  chain:
    network: 百度超级链开放测试网络
    contract-name: eleccert
    node-endpoint: http://127.0.0.1:37101
