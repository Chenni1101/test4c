server:
  # 公网部署平台通常通过 PORT 注入端口；本地默认 8080。
  port: ${PORT:8080}

spring:
  application:
    name: cultural-evidence-backend
  profiles:
    # 不传 SPRING_PROFILES_ACTIVE 时，继续使用本地 H2 演示配置。
    default: local
  sql:
    init:
      # 建表由 Flyway 接管；保留 schema.sql 仅供历史参考，不能与迁移混用。
      mode: never
  flyway:
    enabled: true
    # 已部署旧原型的数据库不运行 V1 建表，只执行后续的增量迁移。
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: legacy-schema
  jpa:
    hibernate:
      # 表结构由 Flyway 迁移维护；各环境不允许 Hibernate 私自变更表结构。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
